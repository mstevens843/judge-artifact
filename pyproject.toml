[project]
name = "judge-artifact"
version = "0.0.0"
description = "An attack-success rate is mean(judge(transcript) == success). Different judges disagree on identical transcripts; judge-artifact measures that gap in both directions, decomposes it into error-, argument- and effect-blindness on 3,986 released AgentDojo transcripts, shows that repairing the judge reorders the defense leaderboard, and names the harm no execution trace can settle."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mathew Stevens" }]
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
# Only for the LLM-judge arm (Arm C) and the grader fidelity test. The model core and the
# deterministic arms have zero third-party dependencies, exactly as tests/test_contract.py asserts.
fidelity = ["inspect-ai>=0.3", "inspect-evals"]
# Offline stored-completion parsing uses the same HTML extractor as upstream. Already in uv.lock.
parser = ["beautifulsoup4==4.15.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "beautifulsoup4==4.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_artifact"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["inspect_ai.*"]
ignore_missing_imports = true

# `arm_d_inspect` builds throwaway inspect_ai tasks, so every function in it is wrapped in an
# `@solver` / `@scorer` decorator owned by inspect_ai. That package is an optional extra, so under
# `uv sync --group dev` it is absent, `ignore_missing_imports` makes the decorators `Any`, and
# strict mode reports `untyped-decorator` - five errors that appear in CI and not on a machine that
# happens to have the extra installed. Disabling that one code for this one module makes mypy give
# the same answer either way; every other strict check still applies here, and a per-site
# `# type: ignore` could not do this, because it would flip to `unused-ignore` whenever the extra
# IS installed.
[[tool.mypy.overrides]]
module = ["judge_artifact.harness.arm_d_inspect"]
disable_error_code = ["untyped-decorator"]
